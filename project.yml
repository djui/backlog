name: BackLog
options:
  bundleIdPrefix: com.djui
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    DEVELOPMENT_TEAM: 8DR8DB9W22
packages:
  BackLogCore:
    path: Packages/BackLogCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"
targets:
  BackLog:
    type: application
    platform: macOS
    sources:
      - path: BackLog
        excludes:
          - "Info.plist"
          - "BackLog.entitlements"
      - Shared/AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djui.BackLog
        PRODUCT_NAME: BackLog
        INFOPLIST_FILE: BackLog/Info.plist
        CODE_SIGN_ENTITLEMENTS: BackLog/BackLog.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: BackLogCore
      - package: Sparkle
        product: Sparkle
      - target: BackLogShare
        embed: true
  BackLogShare:
    type: app-extension
    platform: macOS
    sources:
      - path: BackLogShare
        excludes:
          - "Info.plist"
          - "BackLogShare.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djui.BackLog.Share
        PRODUCT_NAME: BackLogShare
        INFOPLIST_FILE: BackLogShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: BackLogShare/BackLogShare.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @executable_path/../../../../Frameworks"
